<head xmlns:th="http://www.w3.org/1999/xhtml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Naemator</title>
    <link th:href="@{/styles/styles.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        main {
            min-height: 50vh;
        }

        /* ===== Simple Diploma Theme ===== */
        .simple-bg{
          min-height: 100vh;
          background: #f5f7fb;
        }

        .btn-simple-primary{
          background: #2f6fed;
          border-color: #2f6fed;
          color: #fff;
          font-weight: 600;
        }
        .btn-simple-primary:hover{
          filter: brightness(0.95);
          color: #fff;
        }

        /* ===== Listings page extras ===== */
        .listing-card{
          border-radius: 12px;
          overflow: hidden;
        }

        .listing-img{
          height: 210px;
          object-fit: cover;
        }

        .listing-title{
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          min-height: 3.2em; /* keeps cards same height */
        }



        /* ===== Listing details gallery ===== */
.thumb-btn{
  border: 1px solid #dee2e6;
  background: #fff;
  padding: 4px;
  border-radius: 10px;
  cursor: pointer;
}

.thumb-btn.is-active{
  border-color: #2f6fed;
  box-shadow: 0 0 0 2px rgba(47,111,237,.15);
}

.thumb-img{
  width: 72px;
  height: 72px;
  object-fit: cover;
  border-radius: 8px;
  display: block;
}

    </style>
</head>
